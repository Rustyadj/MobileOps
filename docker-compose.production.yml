name: mobileops

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    networks:
      - private
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: mobileops
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:?JWT_REFRESH_SECRET_KEY must be set}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@concreteform.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      ACCESS_TOKEN_EXPIRE_MIN: ${ACCESS_TOKEN_EXPIRE_MIN:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      SIGNUP_ALLOWED_DOMAINS: ${SIGNUP_ALLOWED_DOMAINS:-}
      SIGNUP_INVITE_CODES: ${SIGNUP_INVITE_CODES:-}
      MCP_PUBLIC_URL: ${MOBILEOPS_PUBLIC_URL:-https://icfops.srv1427612.hstgr.cloud}
      MCP_ISSUER_URL: ${MOBILEOPS_PUBLIC_URL:-https://icfops.srv1427612.hstgr.cloud}
      MCP_ALLOWED_HOSTS: ${MOBILEOPS_HOST:-icfops.srv1427612.hstgr.cloud}
      MCP_ALLOWED_ORIGINS: ${MOBILEOPS_PUBLIC_URL:-https://icfops.srv1427612.hstgr.cloud}
      MCP_CONFIRMATION_SECRET: ${MCP_CONFIRMATION_SECRET:?MCP_CONFIRMATION_SECRET must be set}
      HERMES_NATHAN_GATEWAY_URL: ${HERMES_NATHAN_GATEWAY_URL:-ws://127.0.0.1:4862/api/ws}
      HERMES_NATHAN_CONNECT_HOST: ${HERMES_NATHAN_CONNECT_HOST:-host.docker.internal}
      HERMES_NATHAN_CONNECT_PORT: ${HERMES_NATHAN_CONNECT_PORT:-4863}
      HERMES_NATHAN_GATEWAY_TOKEN: ${HERMES_NATHAN_GATEWAY_TOKEN:-}
      HERMES_NATHAN_PROFILE: ${HERMES_NATHAN_PROFILE:-nathan}
    expose:
      - "8000"
    networks:
      - private
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./frontend
      args:
        EXPO_PUBLIC_BACKEND_URL: ${MOBILEOPS_PUBLIC_URL:-https://icfops.srv1427612.hstgr.cloud}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:80"
    networks:
      - private
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  private:
    driver: bridge

volumes:
  mongo_data:
